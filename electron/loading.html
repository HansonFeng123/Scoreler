<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Scoreler</title><link rel="stylesheet" href="palettes.css"><script>const appearance=window.scorelerLoading?.appearance||{};document.documentElement.dataset.palette=appearance.palette||"sage";document.documentElement.dataset.theme=appearance.theme||"light";for(const [key,value] of Object.entries(appearance.variables||{}))document.documentElement.style.setProperty(key,value);if(appearance.image)document.documentElement.style.setProperty("--launch-image",'url("'+appearance.image+'")');</script><style>*{box-sizing:border-box;margin:0}body{height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 75% 15%,#e3eee4,transparent 65%),#f3f6f2;color:#344b41;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}.launch{text-align:center}img{width:72px;height:72px;filter:drop-shadow(0 8px 14px #507c6628)}h1{font-size:28px;font-weight:650;letter-spacing:-1px;margin:16px 0 10px}p{font-size:13px;color:#74857b}.progress{height:3px;width:130px;background:#dce5dc;border-radius:8px;overflow:hidden;margin:24px auto 0}.progress:after{content:"";display:block;height:100%;width:45%;background:#507c66;border-radius:8px;animation:slide 1.2s ease-in-out infinite}@keyframes slide{from{transform:translateX(-110%)}to{transform:translateX(330%)}}@media(prefers-reduced-motion:reduce){.progress:after{animation:none;width:100%}}body{background:var(--bg);background-image:var(--launch-image,none);background-size:cover;background-position:center;color:var(--text)}.launch{padding:25px;border-radius:20px;background:var(--surface)}p{color:var(--muted)}.progress{background:var(--line)}.progress:after{background:var(--accent)}</style></head><body><main class="launch"><img src="scoreler.png" alt=""><h1>Scoreler</h1><p id="status">Opening your study space…</p><div class="progress" role="progressbar" aria-label="Starting Scoreler"></div></main><script>if(appearance.icon)document.querySelector('img').src=appearance.icon;if((appearance.locale||navigator.language).startsWith('zh'))document.getElementById('status').textContent='正在打开你的学习空间…';</script></body></html>

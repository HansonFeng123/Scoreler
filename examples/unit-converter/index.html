<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Unit converter</title><style>body{font:17px system-ui;margin:40px;background:#f4f7f5;color:#20352b}main{max-width:600px;margin:auto;padding:32px;background:white;border-radius:22px}label{display:block;margin:20px 0}input,select{font:inherit;padding:12px;border:1px solid #9cafa4;border-radius:10px}output{display:block;font-size:28px;margin-top:28px}</style><main><h1 id="heading">Unit converter</h1><p id="intro">Length conversion · runs entirely on this device</p><label><input id="amount" type="number" value="1" aria-label="Amount"><select id="from" aria-label="From"><option value="1">Metres / 米</option><option value="1000">Kilometres / 千米</option><option value="0.01">Centimetres / 厘米</option></select></label><label>→ <select id="to" aria-label="To"><option value="0.01">Centimetres / 厘米</option><option value="1">Metres / 米</option><option value="1000">Kilometres / 千米</option></select></label><output id="result"></output></main><script>const amount=document.querySelector('#amount'),from=document.querySelector('#from'),to=document.querySelector('#to');function update(){document.querySelector('#result').textContent=String(Number(amount.value)*Number(from.value)/Number(to.value));}for(const field of [amount,from,to])field.addEventListener('input',update);if(window.ScorelerPlugin?.locale==='zh-CN'){document.querySelector('#heading').textContent='单位换算';document.querySelector('#intro').textContent='长度换算 · 完全在本机运行';}update();</script></html>
